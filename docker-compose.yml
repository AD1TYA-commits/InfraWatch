version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: infrawatch
      POSTGRES_USER: infrawatch
      POSTGRES_PASSWORD: infrawatch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/app/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infrawatch"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://infrawatch:infrawatch@db:5432/infrawatch
      SATELLITE_MODE: ${SATELLITE_MODE:-demo}
      COPERNICUS_CLIENT_ID: ${COPERNICUS_CLIENT_ID:-}
      COPERNICUS_CLIENT_SECRET: ${COPERNICUS_CLIENT_SECRET:-}
      SATELLITE_SERVICE_URL: http://satellite-service:8001
      # Change this for any real deployment — the default is dev-only and
      # intentionally insecure so a forgotten .env doesn't silently ship it.
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-insecure-secret-change-me}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      satellite-service:
        condition: service_started
    # Demo data (6 sample projects), the real 1,000-row MPLADS registry, and
    # one demo analyst/contractor account are all seeded automatically on
    # first boot by app/main.py — nothing to run by hand here. Re-running
    # `docker-compose up` against an existing volume is safe: seeding only
    # happens once, against a genuinely empty database.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  # Standalone microservice — kept in its own sibling folder/repo on purpose,
  # not merged into backend/. See ../satellite-service/docs/04-integration.md.
  satellite-service:
    build: ../satellite-service
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8001:8001"
    volumes:
      - satellite_data:/app/data

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  satellite_data:
